# Ktor logs through SLF4J. slf4j-simple is on the classpath only so that Ktor does not print
# "No SLF4J providers were found" to stderr on every start.
#
# The level is WARN, not INFO, deliberately. Ktor's own INFO output names request paths, and a
# request path on this server contains a blinded record ID -- exactly what RequestLog exists to keep
# out of the log. Everything the operator is meant to see is emitted by RequestLog instead, which
# logs route templates.
org.slf4j.simpleLogger.defaultLogLevel=warn
org.slf4j.simpleLogger.showDateTime=true
org.slf4j.simpleLogger.dateTimeFormat=yyyy-MM-dd HH:mm:ss.SSS
