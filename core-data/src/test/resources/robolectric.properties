# Robolectric emulates SDK 35, not this module's compileSdk of 36.
#
# Left to itself Robolectric targets compileSdk, and Robolectric 4.16 has no android-all jar for
# API 36 yet: DefaultSdkProvider hands back an UnknownSdk whose getJarPath() throws
# UnsupportedOperationException, failing every test in the class before @Before runs.
#
# 35 is the newest API this Robolectric does ship, and it is >= the module's minSdk of 24. Nothing
# in the Room queries or the repository branches on the platform version.
sdk=35
