# Robolectric emulates SDK 35, not this module's compileSdk of 36.
#
# Left to itself Robolectric targets compileSdk, and Robolectric 4.16 has no android-all jar for
# API 36 yet: DefaultSdkProvider hands back an UnknownSdk whose getJarPath() throws
# UnsupportedOperationException, which fails every test in the class before @Before runs.
#
# 35 is the newest API this Robolectric does ship, and it is >= the module's minSdk of 24, so the
# whole runtime-version range this code branches on is still reachable from here. Nothing in
# SecureUnlockManager or its collaborators is gated on 36 specifically.
sdk=35
