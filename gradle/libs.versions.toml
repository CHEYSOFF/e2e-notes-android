ktor-client-core = { group = "io.ktor", name = "ktor-client-core", version.ref = "ktor" }
ktor-client-okhttp = { group = "io.ktor", name = "ktor-client-okhttp", version.ref = "ktor" }
# Not referenced by any build script yet, because there is no Apple target on this machine to
# reference it from -- the Kotlin/Native Apple compilers only run on macOS. It is declared here so
# that adding `iosArm64()` and an `appleMain` source set to :core-sync-net is a source-set addition
# and a one-line dependency, rather than a hunt for the right coordinate and version.
ktor-client-darwin = { group = "io.ktor", name = "ktor-client-darwin", version.ref = "ktor" }
kotlinx-coroutines-core = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-core", version.ref = "coroutines" }
atomicfu = { group = "org.jetbrains.kotlinx", name = "atomicfu", version.ref = "atomicfu" }
sqldelight-runtime = { group = "app.cash.sqldelight", name = "runtime", version.ref = "sqldelight" }
# `Query.asFlow()` — what turns a SQL query into the `Flow` `NotesRepository` returns.
sqldelight-coroutines = { group = "app.cash.sqldelight", name = "coroutines-extensions", version.ref = "sqldelight" }
# The JVM driver. It belongs to no product and is a TEST dependency only: it is what lets the record
# store, and the repository over it, be exercised against a real SQLite database on a machine that
# cannot build for Apple. See core-store/build.gradle.kts.
sqldelight-driver-jvm = { group = "app.cash.sqldelight", name = "sqlite-driver", version.ref = "sqldelight" }
# The Kotlin/Native driver, over SQLiter. Never compiled here.
sqldelight-driver-native = { group = "app.cash.sqldelight", name = "native-driver", version.ref = "sqldelight" }
kotlinx-serialization-json = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-json", version.ref = "kotlinxSerialization" }

sqlite-jdbc = { group = "org.xerial", name = "sqlite-jdbc", version.ref = "sqliteJdbc" }
jna = { group = "net.java.dev.jna", name = "jna", version.ref = "jna" }
jna-platform = { group = "net.java.dev.jna", name = "jna-platform", version.ref = "jna" }
