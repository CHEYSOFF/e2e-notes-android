androidx-compose-material-icons-extended = { module = "androidx.compose.material:material-icons-extended", version.ref = "materialIconsExtended" }
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
junit = { group = "junit", name = "junit", version.ref = "junit" }
# Multiplatform assertions for `commonTest`. Resolves to the JVM (JUnit-backed) variant under
# `jvmTest` and the Native variant under `mingwX64Test` automatically -- this is `kotlin.test`,
