[versions]
agp = "9.0.1"
# Compose Multiplatform. 1.12.0 is the current stable and resolves through the Google mirror
# (Maven Central 403s from this network -- see settings.gradle.kts).
composeMultiplatform = "1.12.0"
# Multiplatform locks. Needed because `kotlin.synchronized` is JVM-only, which the mingwX64
# canary target in :core-domain caught -- see HlcGenerator.
atomicfu = "0.33.0"
kotlin = "2.3.21"
coreKtx = "1.18.0"
junit = "4.13.2"
junitVersion = "1.1.5"
# 1.11.0, and this line no longer has a choice: `ktor-client-core:3.5.2` (:core-sync-net) requires
# kotlinx-coroutines 1.11.0, and Gradle resolves the highest version requested anywhere in the
# graph, so every coroutines artifact in this build is 1.11.0 whatever these two lines say.
#
# They used to say 1.9.0, to keep the graph on jars already cached on a machine that cannot reach
# Maven Central. That constraint has not gone away -- see settings.gradle.kts -- but it is no longer
# satisfiable: the whole 1.11.0 set (core, android, test) was checked against the Google mirror and
# is served there, which is what makes this bump safe rather than merely unavoidable.
coroutinesTest = "1.11.0"
espressoCore = "3.5.1"
kotlinGradlePlugin = "2.3.21"
lifecycleRuntimeKtx = "2.10.0"
activityCompose = "1.13.0"
composeBom = "2026.05.01"
appcompat = "1.7.1"
material = "1.14.0"
# 2.60.1, not 2.59.2, because of the richeditor 1.1.0 bump below. richeditor 1.1.0 is built with
# Kotlin 2.4.10 and its POM requires kotlin-stdlib 2.4.10, which Gradle resolves for the whole
# graph (the project itself still COMPILES with Kotlin 2.3.21 -- only the stdlib moves). Hilt
# reads @Metadata off the classes it processes, and 2.59.2 ships a kotlin-metadata-jvm that
# refuses anything past metadata version 2.3.0, so :app:hiltJavaCompileDebug failed outright with
# "Provided Metadata instance has version 2.4.0, while maximum supported version is 2.3.0".
# 2.60.1 reads it. The alternative -- forcing kotlin-stdlib back to 2.3.21 -- was tried and also
# builds, but it would run a library compiled against the 2.4 stdlib on the 2.3 one, so this is
# the safer of the two. Nothing else about Hilt changed.
dagger = "2.60.1"
hiltNavigationCompose = "1.3.0"
biometric = "1.4.0-alpha05"
materialIconsExtended = "1.7.8"
navigationCompose = "2.9.8"
securityCrypto = "1.1.0-alpha06"
sqlcipher = "4.13.0"
sqlite = "2.4.0"
room = "2.8.4"
lifecycleProcess = "2.10.0"
datastore = "1.2.1"
# Treat a change to this line as a content-schema change, not a routine dependency bump: the
# version decides how every HTML note body is serialised, and the two versions do NOT agree.
# 1.0.0-rc14 escaped text through KsoupEntities.encodeHtml, which emits a named entity for nearly
# every punctuation mark and every non-ASCII letter -- "." became "&period;", "@" became
# "&commat;", and each Cyrillic letter became something like "&Pcy;". 1.1.0 escapes only "&", "<"
# and ">". For a Russian note that is a real difference: a heading + bold + bullet-list note
# measured 357 bytes of stored UTF-8 under rc14 and 168 under 1.1.0, and a one-line Cyrillic
# paragraph went from 130 bytes to 54.
#
# Both directions were verified on an API 33 emulator before this bump, and both are guarded by
# RichEditorHtmlRoundTripTest: 1.1.0 decodes rc14's entity-escaped bytes losslessly, and rc14
# decodes 1.1.0's literal bytes losslessly, so the upgrade is reversible. Re-run that test on
# every change to this line -- it is the only thing standing between a version bump and silently
# mangling the whole note library.
richeditor = "1.1.0"
ksp = "2.3.9"
# What actually opens the socket on Android and on the JVM. It is reached through Ktor's OkHttp
# *engine* rather than directly, so that the same client code can run on an Apple target through the
# Darwin engine -- see core-sync-net/src/jvmCommonMain/.../SyncEngine.jvmCommon.kt.
#
# Chosen originally for `CertificatePinner`, which pins on the SHA-256 of the DER
# SubjectPublicKeyInfo -- exactly the value the pairing QR already carries as
# `ServerHint.spkiPinSha256`. See docs/design/e2e-sync-phase3-plan.md §10, decision D1. That is
# still why OkHttp and not something else.
#
# 5.3.2, and NOT the 4.12.0 this line used to hold: `ktor-client-okhttp:3.5.2` requires okhttp-jvm
# 5.3.2 and compiles against its API, so Gradle resolves 5.3.2 whatever this line says. It is
# written out rather than left implicit because a version this project runs on and does not name is
# a version nobody is watching. The old reasoning for 4.x (minSdk 21, okio and the stdlib as its
# only transitive dependencies) still holds of 5.x on both counts; what changed is that OkHttp now
# ships a separate `okhttp-android` artifact, which Gradle picks for the Android variant.
okhttp = "5.3.2"
# The multiplatform HTTP client :core-sync-net is written against. It is a client with SWAPPABLE
# ENGINES, not a second HTTP implementation: `KtorHttpTransport` is one file of common code and the
# per-platform part is the engine underneath it (OkHttp on Android and the JVM, Darwin on Apple).
# That distinction is the whole reason for the dependency -- a hand-written second client for Apple
# would be two implementations whose only job is to agree with each other, which is the failure this
# repository has already shipped once (two HKDFs).
ktor = "3.5.2"
# 1.11.0 to match `coroutinesTest` above, and forced by the same dependency. See its comment.
coroutines = "1.11.0"
zxing = "3.5.3"
camerax = "1.5.0"
robolectric = "4.16"
# SQLDelight: the SQL behind the record store, for the Apple targets and for the JVM tests that
# stand in for them. 2.3.2 resolves through the Google mirror (Maven Central 403s from this network
# -- see settings.gradle.kts) and publishes both a Kotlin/Native driver and a JVM one.
#
# Chosen over sqlite-jdbc, which is what a JVM-only store would reach for and which has no Apple
# artifact at all, and over hand-written `platform.sqlite3` cinterop, which would be a couple of
# hundred lines of unverifiable pointer code. The property that decided it: SQLDelight's code
# GENERATION is a plain JVM task, so the schema is parsed and the queries are type-checked on this
# machine even though no Apple target can be compiled here -- and its JVM driver then lets the
# store and the repository above it be tested against a real SQLite database.
sqldelight = "2.3.2"

sqliteJdbc = "3.53.4.0"
jna = "5.19.1"
# Taken for its runtime only -- the serialization COMPILER PLUGIN is deliberately not applied
# anywhere in this build. :core-sync-codec builds its JSON object key by key, which is what fixes
# the key order (so a record encodes to the same bytes on every device) and makes every unknown key
# a decode failure rather than a silently ignored one.
kotlinxSerialization = "1.9.0"
richeditorDesktop = "1.2.0"

