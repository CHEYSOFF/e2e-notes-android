androidx-sqlite = { group = "androidx.sqlite", name = "sqlite-ktx", version.ref = "sqlite" }
androidx-room-runtime = { group = "androidx.room", name = "room-runtime", version.ref = "room" }
androidx-room-ktx = { group = "androidx.room", name = "room-ktx", version.ref = "room" }
androidx-room-compiler = { group = "androidx.room", name = "room-compiler", version.ref = "room" }
androidx-lifecycle-process = { group = "androidx.lifecycle", name = "lifecycle-process", version.ref = "lifecycleProcess" }
androidx-datastore-preferences = { group = "androidx.datastore", name = "datastore-preferences", version.ref = "datastore" }
zxing-core = { group = "com.google.zxing", name = "core", version.ref = "zxing" }
androidx-camera-core = { group = "androidx.camera", name = "camera-core", version.ref = "camerax" }
androidx-camera-camera2 = { group = "androidx.camera", name = "camera-camera2", version.ref = "camerax" }
androidx-camera-lifecycle = { group = "androidx.camera", name = "camera-lifecycle", version.ref = "camerax" }
androidx-camera-view = { group = "androidx.camera", name = "camera-view", version.ref = "camerax" }
robolectric = { group = "org.robolectric", name = "robolectric", version.ref = "robolectric" }
okhttp = { group = "com.squareup.okhttp3", name = "okhttp", version.ref = "okhttp" }
ktor-client-core = { group = "io.ktor", name = "ktor-client-core", version.ref = "ktor" }
ktor-client-okhttp = { group = "io.ktor", name = "ktor-client-okhttp", version.ref = "ktor" }
# Not referenced by any build script yet, because there is no Apple target on this machine to
# reference it from -- the Kotlin/Native Apple compilers only run on macOS. It is declared here so
# that adding `iosArm64()` and an `appleMain` source set to :core-sync-net is a source-set addition
# and a one-line dependency, rather than a hunt for the right coordinate and version.
ktor-client-darwin = { group = "io.ktor", name = "ktor-client-darwin", version.ref = "ktor" }
kotlinx-coroutines-core = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-core", version.ref = "coroutines" }
atomicfu = { group = "org.jetbrains.kotlinx", name = "atomicfu", version.ref = "atomicfu" }
kotlinx-serialization-json = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-json", version.ref = "kotlinxSerialization" }

sqlite-jdbc = { group = "org.xerial", name = "sqlite-jdbc", version.ref = "sqliteJdbc" }
jna = { group = "net.java.dev.jna", name = "jna", version.ref = "jna" }
jna-platform = { group = "net.java.dev.jna", name = "jna-platform", version.ref = "jna" }
# The HTML entity codec the pre-blocks rich-text editor escaped note bodies with. Its 1.0.0-rc14
# release ran text through KsoupEntities.encodeHtml, which emits a named entity for nearly every
# punctuation mark and every non-ASCII letter ("." became "&period;", each Cyrillic letter something
# like "&Pcy;"); its 1.1.0 release escaped only "&", "<" and ">". HTML bodies in both shapes are still
# on disk, and LegacyImport (:core-blocks) and DesktopHtmlText (:desktop) decode them with these same
# tables, so the decode is the encoder's exact inverse rather than a hand-maintained entity table.
# Treat a change to this version as a content-schema change: LegacyImportTest's rc14 and 1.1.0
# inputs are the guard.
ksoup-entities = { group = "com.mohamedrejeb.ksoup", name = "ksoup-entities-jvm", version = "0.6.0" }
ksoup-entities-common = { group = "com.mohamedrejeb.ksoup", name = "ksoup-entities", version = "0.6.0" }
compose-material-icons-core = { group = "org.jetbrains.compose.material", name = "material-icons-core-desktop", version = "1.7.3" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
android-library = { id = "com.android.library", version.ref = "agp" }
kotlin-multiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
# AGP 9 refuses `com.android.library` alongside the KMP plugin; this is its replacement for a
# multiplatform module that has an Android target. See core-domain/build.gradle.kts.
android-kmp-library = { id = "com.android.kotlin.multiplatform.library", version.ref = "agp" }
compose-multiplatform = { id = "org.jetbrains.compose", version.ref = "composeMultiplatform" }
kotlin-kapt = { id = "org.jetbrains.kotlin.kapt", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
dagger-hilt = { id = "com.google.dagger.hilt.android", version.ref = "dagger" }
