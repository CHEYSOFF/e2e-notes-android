[versions]
agp = "9.0.1"
kotlin = "2.3.21"
coreKtx = "1.18.0"
junit = "4.13.2"
junitVersion = "1.1.5"
# 1.9.0, not the newest, on purpose: kotlinx-coroutines-android is already cached at 1.9.0 here,
# and Gradle picks the highest requested version across the graph. Asking for test:1.10.2 dragged
# coroutines-android up to 1.10.2 as well, making TWO jars unavailable instead of one. At 1.9.0 the
# whole graph settles on versions already present except a single artifact.
coroutinesTest = "1.9.0"
espressoCore = "3.5.1"
kotlinGradlePlugin = "2.3.21"
lifecycleRuntimeKtx = "2.10.0"
activityCompose = "1.13.0"
composeBom = "2026.05.01"
appcompat = "1.7.1"
material = "1.14.0"
# 2.60.1, not 2.59.2, because of the richeditor 1.1.0 bump below. richeditor 1.1.0 is built with
# Kotlin 2.4.10 and its POM requires kotlin-stdlib 2.4.10, which Gradle resolves for the whole
# graph (the project itself still COMPILES with Kotlin 2.3.21 -- only the stdlib moves). Hilt
# reads @Metadata off the classes it processes, and 2.59.2 ships a kotlin-metadata-jvm that
# refuses anything past metadata version 2.3.0, so :app:hiltJavaCompileDebug failed outright with
# "Provided Metadata instance has version 2.4.0, while maximum supported version is 2.3.0".
# 2.60.1 reads it. The alternative -- forcing kotlin-stdlib back to 2.3.21 -- was tried and also
# builds, but it would run a library compiled against the 2.4 stdlib on the 2.3 one, so this is
# the safer of the two. Nothing else about Hilt changed.
dagger = "2.60.1"
hiltNavigationCompose = "1.3.0"
biometric = "1.4.0-alpha05"
materialIconsExtended = "1.7.8"
navigationCompose = "2.9.8"
securityCrypto = "1.1.0-alpha06"
sqlcipher = "4.13.0"
sqlite = "2.4.0"
room = "2.8.4"
lifecycleProcess = "2.10.0"
datastore = "1.2.1"
# Treat a change to this line as a content-schema change, not a routine dependency bump: the
# version decides how every HTML note body is serialised, and the two versions do NOT agree.
# 1.0.0-rc14 escaped text through KsoupEntities.encodeHtml, which emits a named entity for nearly
# every punctuation mark and every non-ASCII letter -- "." became "&period;", "@" became
# "&commat;", and each Cyrillic letter became something like "&Pcy;". 1.1.0 escapes only "&", "<"
# and ">". For a Russian note that is a real difference: a heading + bold + bullet-list note
# measured 357 bytes of stored UTF-8 under rc14 and 168 under 1.1.0, and a one-line Cyrillic
# paragraph went from 130 bytes to 54.
#
# Both directions were verified on an API 33 emulator before this bump, and both are guarded by
# RichEditorHtmlRoundTripTest: 1.1.0 decodes rc14's entity-escaped bytes losslessly, and rc14
# decodes 1.1.0's literal bytes losslessly, so the upgrade is reversible. Re-run that test on
# every change to this line -- it is the only thing standing between a version bump and silently
# mangling the whole note library.
richeditor = "1.1.0"
ksp = "2.3.9"

[libraries]
androidx-compose-material-icons-extended = { module = "androidx.compose.material:material-icons-extended", version.ref = "materialIconsExtended" }
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
junit = { group = "junit", name = "junit", version.ref = "junit" }
androidx-test-runner = { group = "androidx.test", name = "runner", version = "1.5.2" }
androidx-junit = { group = "androidx.test.ext", name = "junit", version.ref = "junitVersion" }
androidx-espresso-core = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "espressoCore" }
androidx-lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycleRuntimeKtx" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
androidx-compose-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-compose-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
androidx-compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
androidx-compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
androidx-compose-ui-test-manifest = { group = "androidx.compose.ui", name = "ui-test-manifest" }
androidx-compose-ui-test-junit4 = { group = "androidx.compose.ui", name = "ui-test-junit4" }
kotlinx-coroutines-test = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-test", version.ref = "coroutinesTest" }
androidx-compose-material3 = { group = "androidx.compose.material3", name = "material3" }
androidx-appcompat = { group = "androidx.appcompat", name = "appcompat", version.ref = "appcompat" }
kotlin-gradle-plugin = { module = "org.jetbrains.kotlin:kotlin-gradle-plugin", version.ref = "kotlinGradlePlugin" }
material = { group = "com.google.android.material", name = "material", version.ref = "material" }
hilt-android = { group = "com.google.dagger", name = "hilt-android", version.ref = "dagger" }
hilt-compiler = { group = "com.google.dagger", name = "hilt-compiler", version.ref = "dagger" }
hilt-navigation-compose = { group = "androidx.hilt", name = "hilt-navigation-compose", version.ref = "hiltNavigationCompose" }
androidx-biometric = { group = "androidx.biometric", name = "biometric-compose", version.ref = "biometric" }
androidx-navigation-compose = { group = "androidx.navigation", name = "navigation-compose", version.ref = "navigationCompose" }
androidx-compose-runtime-saveable = { group = "androidx.compose.runtime", name = "runtime-saveable" }
androidx-security-crypto = { group = "androidx.security", name = "security-crypto", version.ref = "securityCrypto" }
sqlcipher = { group = "net.zetetic", name = "sqlcipher-android", version.ref = "sqlcipher" }
androidx-sqlite = { group = "androidx.sqlite", name = "sqlite-ktx", version.ref = "sqlite" }
androidx-room-runtime = { group = "androidx.room", name = "room-runtime", version.ref = "room" }
androidx-room-ktx = { group = "androidx.room", name = "room-ktx", version.ref = "room" }
androidx-room-compiler = { group = "androidx.room", name = "room-compiler", version.ref = "room" }
androidx-lifecycle-process = { group = "androidx.lifecycle", name = "lifecycle-process", version.ref = "lifecycleProcess" }
androidx-datastore-preferences = { group = "androidx.datastore", name = "datastore-preferences", version.ref = "datastore" }
richeditor-compose = { group = "com.mohamedrejeb.richeditor", name = "richeditor-compose", version.ref = "richeditor" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
android-library = { id = "com.android.library", version.ref = "agp" }
kotlin-kapt = { id = "org.jetbrains.kotlin.kapt", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
dagger-hilt = { id = "com.google.dagger.hilt.android", version.ref = "dagger" }
